function photo(i,lazy=true){const p=node('div','photo');const f=node('div','photo-fallback',catName(i.c));p.append(f);attachImage(p,i,lazy);return p}
function cost(i){const p=node('div');if(i.p.length>1)p.append(node('span','from',t('من','From')));p.append(node('span','price',fmt(i.p[0])),node('span','currency',t('د.ع','IQD')));return p}
function tile(i,compact){const b=node('button',compact?'compact':'card');b.type='button';b.setAttribute('aria-label',name(i)+' · '+fmt(i.p[0])+' IQD');const copy=node('div',compact?'':'card-info');copy.append(node('h4','',name(i)),node('p','sub',other(i)));const end=node('div',compact?'end':'bottom');end.append(cost(i),node('span','plus','+'));if(compact)b.append(copy,end);else{copy.append(end);b.append(photo(i),copy)}b.addEventListener('click',()=>openDetail(i));return b}
function updateURL(){const p=new URLSearchParams(location.search);if(lang==='en')p.set('lang','en');else p.delete('lang');if(branch!=='all')p.set('branch',branch);else p.delete('branch');history.replaceState(null,'',location.pathname+(p.size?'?'+p:'')+location.hash)}
function renderTabs(){const old=$tabs.scrollLeft;$tabs.replaceChildren();[['all',t('الكل','All')],...cats.map(c=>[c[0],c[lang==='ar'?1:2]])].forEach(([id,label])=>{const b=node('button','tab',label);b.type='button';b.dataset.cat=id;b.setAttribute('aria-pressed',String(active===id));b.onclick=()=>{active=id;render();$tabs.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',String(x.dataset.cat===active)));b.scrollIntoView({block:'nearest',inline:'nearest'});if($('#menu').getBoundingClientRect().top<0)$('#menu').scrollIntoView({block:'start',behavior:'instant'})};$tabs.append(b)});$tabs.scrollLeft=old}
function render(){const query=norm(term.trim());const items=data.filter(i=>(active==='all'||i.c===active)&&(!query||norm(i.ar+' '+i.en+' '+catName(i.c)).includes(query)));$catalog.replaceChildren();$('#count').textContent=t(items.length+' صنف',items.length+' items');if(!items.length){$catalog.append(node('div','empty',t('ما لقينا صنف مطابق لبحثك.','No matching items.')));return}for(const c of cats){const itemsIn=items.filter(i=>i.c===c[0]);if(!itemsIn.length)continue;const section=node('section','category');const h=node('div','section-title');h.append(node('h3','',catName(c[0])),node('span','latin',c[3]+' / '+c[2].toUpperCase()));section.append(h);const featured=itemsIn.filter(i=>i.img),rest=itemsIn.filter(i=>!i.img);if(featured.length){const g=node('div','grid');featured.forEach(i=>g.append(tile(i,false)));section.append(g)}if(rest.length){const g=node('div','compact-grid');rest.forEach(i=>g.append(tile(i,true)));section.append(g)}$catalog.append(section)}}
function openDetail(i){selected=i;const target=$('#detailContent');target.replaceChildren();if(i.img)target.append(photo(i,false));const b=node('div','detail-body');const h=node('h2','',name(i));h.id='detailTitle';b.append(h,node('p','',other(i)));i.p.forEach((p,k)=>{const row=node('div','size-row');row.append(node('span','',i.p.length===1?t('السعر','Price'):[t('صغير','Small'),t('وسط','Medium'),t('كبير','Large')][k]),node('strong','price',fmt(p)+' IQD'));b.append(row)});if(i.c==='iced')b.append(node('p','extra',t('الإضافات المتاحة في القائمة: إسبريسو، كريمة، نكهة أو حليب بديل — 1,000 د.ع لكل إضافة.','Menu extras: espresso, whipped cream, flavor or alternative milk — IQD 1,000 each.')));b.append(node('p','note',t('السعر المعروض من القائمة المنشورة؛ يرجى تأكيد التوفر والسعر بالفرع.','Published menu price; confirm price and availability at the branch.')));target.append(b);if(!$detail.open)$detail.showModal()}
function translate(){document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';document.querySelectorAll('[data-ar]').forEach(el=>el.textContent=el.dataset[lang]);$('#lang').textContent=t('EN','عربي');$('#lang').setAttribute('aria-label',t('English','العربية'));$('#searchLabel').textContent=t('ابحث عن صنف','Search menu');$search.placeholder=t('ابحث عن صنف','Search menu');$('#clear').setAttribute('aria-label',t('مسح البحث','Clear search'));$('#close').setAttribute('aria-label',t('إغلاق','Close'));$('#branch').setAttribute('aria-label',t('الفرع','Branch'));$tabs.setAttribute('aria-label',t('التصنيفات','Categories'));$('#branch').replaceChildren(...branches.map(b=>{const o=node('option','',b[lang==='ar'?1:2]);o.value=b[0];return o}));$('#branch').value=branch;renderTabs();render();updateURL()}
$('#lang').onclick=()=>{lang=t('en','ar');translate()};$('#branch').onchange=e=>{branch=e.target.value;updateURL()};$search.oninput=()=>{term=$search.value;$('#clear').hidden=!term;render()};$('#clear').onclick=()=>{$search.value=term='';$('#clear').hidden=true;render();$search.focus()};$('#close').onclick=()=>$detail.close();$detail.addEventListener('click',e=>{if(e.target===$detail){const r=$detail.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)$detail.close()}});$detail.addEventListener('close',()=>{selected=null;document.body.style.overflow=''});$detail.addEventListener('cancel',()=>{document.body.style.overflow=''});$detail.addEventListener('keydown',e=>{if(e.key==='Escape')$detail.close()});translate();attachImage($('#heroVisual'),data.find(i=>i.id===33),false);
</script></body></html>
